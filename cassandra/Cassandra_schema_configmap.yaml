apiVersion: v1
kind: ConfigMap

metadata:
  name: cassandra-schema
  namespace: video-pipeline

data:

  schema.cql: |

    CREATE KEYSPACE IF NOT EXISTS youtube_video_pipeline
    WITH replication = {'class': 'NetworkTopologyStrategy', 'dc1': 3};

    -- one row per video per snapshot. video_id is the partition key so every
    -- snapshot of the same video lands on the same node, and the newest
    -- snapshot is the first row of the partition.
    CREATE TABLE IF NOT EXISTS youtube_video_pipeline.videos (
        video_id          text,
        snapshot_date     timestamp,
        title             text,
        channel_name      text,
        channel_id        text,
        language          text,
        publish_date      timestamp,
        view_count        bigint,
        like_count        bigint,
        comment_count     bigint,
        age_in_days       int,
        engagement_score  double,
        engagement_rate   double,
        freshness_rate    double,
        PRIMARY KEY ((video_id), snapshot_date)
    ) WITH CLUSTERING ORDER BY (snapshot_date DESC);
