apiVersion: apps/v1
kind: Deployment

metadata:
  name: spark-driver
  namespace: video-pipeline

spec:
  replicas: 1

  selector:
    matchLabels:
      app: spark-driver

  template:
    metadata:
      labels:
        app: spark-driver

    spec:
      # same reason as the master, see spark-master-deployment.yaml
      enableServiceLinks: false

      containers:

      - name: spark-driver

        # built locally, see spark/Dockerfile
        image: spark-calculator:latest
        imagePullPolicy: Never

        env:

        - name: MASTER_NODE_ADDRESS
          value: spark://spark-master:7077

        # Must not exceed the --cores a single worker advertises. Standalone
        # mode places an executor inside one worker, so asking for 2 cores
        # while each worker offers 1 means no executor is ever launched: the
        # app registers, sits there requesting resources, and no batch ever
        # runs. There is no error, it just waits.
        - name: NUMBER_OF_CORES_PER_EXECUTOR
          value: "1"

        # the bootstrap service, same address the producer uses. the client
        # discovers the rest of the brokers from it.
        - name: BROKER_ADDRESSES
          value: kafka-bootstrap:9092

        - name: TOPIC
          value: youtube_videos

        - name: CASSANDRA_HOST
          value: cassandra

        - name: CASSANDRA_PORT
          value: "9042"

        - name: CASSANDRA_KEYSPACE_NAME
          value: youtube_video_pipeline

        - name: CASSANDRA_TABLE_NAME
          value: videos

        - name: ELASTICSEARCH_NODES
          value: elasticsearch

        - name: ELASTICSEARCH_PORT
          value: "9200"

        - name: ELASTICSEARCH_INDEX
          value: youtube_videos

        - name: PROCESSING_TIME_SECONDS
          value: "10"

        # Bounds each micro-batch so batches are comparable between runs of the
        # scaling experiment. Remove it for normal operation, where draining
        # the whole backlog at once is what you want.
        - name: MAX_OFFSETS_PER_TRIGGER
          value: "10000"

        # executors connect back to the driver, so it has to advertise an
        # address they can reach. the pod IP is routable inside the cluster.
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        - name: SPARK_DRIVER_HOST
          value: $(POD_IP)

        # spark.jars.packages resolves through ivy at startup and needs a
        # writable home, which the base image does not give the spark user
        - name: HOME
          value: /tmp

        volumeMounts:

        - name: checkpoint
          mountPath: /app/checkpoint

        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi

      volumes:

      - name: checkpoint
        persistentVolumeClaim:
          claimName: spark-checkpoint
