apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: kafka
  namespace: video-pipeline

spec:
  serviceName: kafka

  replicas: 3

  selector:
    matchLabels:
      app: kafka
  
  template:
    metadata:
      labels:
        app: kafka
    
    spec:

      containers:

      - name: kafka

        image: apache/kafka:4.3.1
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 9092
          name: broker
        
        - containerPort: 29093
          name: controller
      
        env:

        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk

        - name: KAFKA_PROCESS_ROLES
          value: broker,controller

        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER

        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT

        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"

        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data

        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:29093

        - name: KAFKA_NUM_PARTITIONS
          value: "5"
        
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"

        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        
        
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 0@kafka-0.kafka.video-pipeline.svc.cluster.local:29093,1@kafka-1.kafka.video-pipeline.svc.cluster.local:29093,2@kafka-2.kafka.video-pipeline.svc.cluster.local:29093

        command:
          - sh
          - -c
          - |
            ORDINAL=${POD_NAME##*-}

            export KAFKA_NODE_ID=$ORDINAL

            export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${POD_NAME}.kafka.video-pipeline.svc.cluster.local:9092"

            exec /__cacert_entrypoint.sh /etc/kafka/docker/run

        volumeMounts:
        - name: kafka-storage
          mountPath: /var/lib/kafka/data
      
  volumeClaimTemplates:

    - metadata:
        name: kafka-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi